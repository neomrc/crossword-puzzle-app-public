name: Add puzzle readiness loader

on:
  push:
    paths:
      - '.github/workflows/readiness-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loading and readiness checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text()

          state_old = 'let state={screen:"home",difficulty:"easy",size:5,puzzle:null,selected:null,direction:"across",tab:"across",checked:false};'
          state_new = 'let state={screen:"home",difficulty:"easy",size:5,puzzle:null,selected:null,direction:"across",tab:"across",checked:false,loading:false,loadMessage:"Preparing puzzles…",loadError:""};'
          if state_old in s:
              s = s.replace(state_old, state_new, 1)

          anchor = 'function masthead()'
          helpers = '''function minimumWordsForSize(size){return size<=5?5:size<=7?6:size<=9?7:size<=11?8:size<=13?9:10}
function usableWordCount(difficulty,size){const combined=[...(WORDS[difficulty]||[]),...(typeof CORE_WORDS!=="undefined"?CORE_WORDS:[])];return new Set(combined.filter(([word])=>word.length>=3&&word.length<=size).map(([word])=>word)).size}
function needsMoreWords(difficulty,size){return usableWordCount(difficulty,size)<Math.max(18,minimumWordsForSize(size)*3)}
function setLoading(active,message="Preparing puzzles…",error=""){state.loading=active;state.loadMessage=message;state.loadError=error;render()}
async function fetchWordsForSelection(difficulty,size){if(!navigator.onLine)throw new Error("Connect to the internet to download more words for this puzzle size.");const lengths=[];for(let n=3;n<=size;n++)lengths.push(n);const requests=lengths.map(length=>fetch(`https://api.datamuse.com/words?sp=${"?".repeat(length)}&md=d&max=40`).then(r=>{if(!r.ok)throw new Error(`Word service returned ${r.status}`);return r.json()}));const groups=await Promise.all(requests);const fresh=[];for(const group of groups){for(const item of group){const word=String(item.word||"").toUpperCase();const clue=Array.isArray(item.defs)&&item.defs.length?item.defs[0].replace(/^[a-z]+\\t/i,"").trim():"";if(/^[A-Z]{3,15}$/.test(word)&&clue)fresh.push({word,clue})}}const cached=JSON.parse(localStorage.getItem(ONLINE_WORDS_KEY)||"[]");const merged=[...new Map([...cached,...fresh].map(item=>[String(item.word).toLowerCase(),item])).values()].slice(0,300);localStorage.setItem(ONLINE_WORDS_KEY,JSON.stringify(merged));mergeOnlineWords(merged);return merged.length}
async function ensurePuzzleReadiness(){const difficulty=state.difficulty,size=Number(state.size);if(!needsMoreWords(difficulty,size))return true;setLoading(true,`Downloading words for ${size} × ${size} ${difficulty} puzzles…`);try{await fetchWordsForSelection(difficulty,size);if(typeof rebuildPuzzles==="function")rebuildPuzzles();if(needsMoreWords(difficulty,size))throw new Error("Not enough suitable words were found. Try another size or difficulty.");state.loading=false;state.loadError="";render();return true}catch(error){state.loading=false;state.loadError=error.message||"Unable to prepare puzzles.";render();return false}}
'''
          if helpers not in s:
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit('masthead anchor missing')
              s = s[:pos] + helpers + s[pos:]

          s = s.replace('<select class="filter" id="difficulty">', '<select class="filter" id="difficulty" ${state.loading?"disabled":""}>', 1)
          s = s.replace('<select class="filter" id="size">', '<select class="filter" id="size" ${state.loading?"disabled":""}>', 1)
          s = s.replace('<button class="play-btn" data-id="${featured.id}">', '<button class="play-btn" data-id="${featured.id}" ${state.loading||state.loadError?"disabled":""}>', 1)

          home_end = '</section></main></div>`}'
          overlay = '${state.loading?`<div class="loading-overlay" role="status" aria-live="polite"><div class="loading-card"><div class="spinner"></div><strong>${state.loadMessage}</strong><span>Please keep this page open.</span></div></div>`:""}${state.loadError?`<div class="readiness-error"><strong>Puzzle unavailable</strong><span>${state.loadError}</span><button id="retryWords">Retry</button></div>`:""}</section></main></div>`}'
          if home_end in s:
              s = s.replace(home_end, overlay, 1)

          old_handlers = 'document.querySelector("#difficulty")?.addEventListener("change",e=>{state.difficulty=e.target.value;render()});document.querySelector("#size")?.addEventListener("change",e=>{state.size=Number(e.target.value);render()});document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{'
          new_handlers = 'document.querySelector("#difficulty")?.addEventListener("change",async e=>{state.difficulty=e.target.value;render();await ensurePuzzleReadiness()});document.querySelector("#size")?.addEventListener("change",async e=>{state.size=Number(e.target.value);render();await ensurePuzzleReadiness()});document.querySelector("#retryWords")?.addEventListener("click",ensurePuzzleReadiness);document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{if(state.loading)return;if(needsMoreWords(state.difficulty,Number(state.size))&&!(await ensurePuzzleReadiness()))return;'
          if old_handlers in s:
              s = s.replace(old_handlers, new_handlers, 1)

          bootstrap = "render();refreshOnlineWords();window.addEventListener('online',refreshOnlineWords);"
          if bootstrap in s:
              s = s.replace(bootstrap, "render();ensurePuzzleReadiness();refreshOnlineWords();window.addEventListener('online',()=>{refreshOnlineWords();ensurePuzzleReadiness()});", 1)

          p.write_text(s)
          PY
      - name: Add loader styles
        run: |
          cat >> styles.css <<'CSS'
          .loading-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(4px);padding:20px}.loading-card{width:min(360px,100%);border:1px solid var(--ink);background:#fff;padding:28px;display:grid;gap:12px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.12)}.loading-card strong{font-family:Georgia,'Times New Roman',serif;font-size:22px}.loading-card span{color:var(--muted);font-size:13px}.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto;animation:crossword-spin .8s linear infinite}@keyframes crossword-spin{to{transform:rotate(360deg)}}.readiness-error{margin-top:16px;border:1px solid #9d1c1c;background:#fff5f5;padding:16px;display:grid;gap:8px}.readiness-error strong{font-family:Georgia,'Times New Roman',serif;font-size:20px}.readiness-error span{color:#671313}.readiness-error button{justify-self:start;border:1px solid var(--ink);background:#fff;padding:9px 14px;font-weight:700}.filter:disabled,.play-btn:disabled,.puzzle-row:disabled{opacity:.5;cursor:not-allowed}
          CSS
      - name: Bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('service-worker.js')
          s=p.read_text()
          s=re.sub(r'crossword-quest-public-v\d+', 'crossword-quest-public-v9', s, count=1)
          p.write_text(s)
          PY
      - name: Commit readiness behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css service-worker.js
          git commit -m "Load additional words before enabling sparse puzzles"
          git push
